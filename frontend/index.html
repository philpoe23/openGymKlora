<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<script>
  // Set direction before first paint so an Arabic profile never flashes as LTR.
  // The app re-applies this on every language change (lib/i18n.js setLang).
  // i18n-core RTL_LANGS is the runtime source of truth — keep this list in sync.
  try {
    var s = JSON.parse(localStorage.getItem('gym_state_v1') || '{}');
    var l = s.lang || ((navigator.language || '').slice(0, 2) === 'ar' ? 'ar' : 'en');
    document.documentElement.lang = l;
    document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr';
  } catch (e) {}
</script>
<title>Klora Fitness</title>
<meta name="description" content="Training and coaching with Klora">
<meta name="theme-color" content="#fbeff4">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Klora">
<!-- use-credentials: browsers fetch the manifest without cookies, even same-origin; behind an auth
     proxy (Authelia, Cloudflare Access, Teleport…) that fetch is a login redirect and the Home Screen
     icon comes out generic. iOS 26 reads the icon from the manifest, so this is where it shows. -->
<link rel="manifest" href="manifest.json" crossorigin="use-credentials">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-180.png">
</head>

<!--
THESIS: Load is colour. Klora is a rack of coated pastel hand-weights: every tier (a client, a standing, a day, a state) owns one matte neoprene colour. Refuses the near-black neon fitness dashboard and the beige wellness minimal.
OWN-WORLD: blush ground #fbeff4 / plum night #1a0f16; plum ink #3a1d2c; one hot rose #cf3a76 for action and "now" only; rack tiers rose, lilac, mint, butter, peach, sky, each fill with its own ink. Moulded vinyl slabs (flat fill, thin top light, soft resting shadow), pills everywhere, Rubik numerals and headings.
STORY: a client opens it in the gym, sees today as the fattest rose pill and taps Start; the trainer opens Clients, reads the rack of who needs her today, replies or sends the next block in minutes.
FIRST VIEWPORT: Home: Rubik greeting top-left, week as seven rack capsules (planned rose, done mint, today plum ring), Today pill with a rose Start tag, floating rack tab bar with a rose weight-plate Start seated in its middle.
FORM: Pastel Dumbbell Rack, #1 on my grounded list (model pick), seed d1b9581b. Signature: press-and-settle, every pill sinks 1px and its shadow tightens.
FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, and DESIGN.md
-->
